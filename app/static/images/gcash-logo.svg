<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Outer black circle -->
  <circle cx="50" cy="50" r="48" fill="#000000"/>
  
  <!-- Inner white ring -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="white" stroke-width="6"/>
  
  <!-- White G letter -->
  <text x="50" y="64" text-anchor="middle" fill="white" font-family="Arial Black, sans-serif" font-size="40" font-weight="900">G</text>
  
  <!-- Signal waves on right side -->
  <g stroke="white" stroke-width="4" fill="none" stroke-linecap="round">
    <!-- Outer wave -->
    <path d="M 70 35 Q 75 42 75 50 Q 75 58 70 65"/>
    <!-- Inner wave -->
    <path d="M 75 38 Q 78 44 78 50 Q 78 56 75 62"/>
  </g>
</svg>