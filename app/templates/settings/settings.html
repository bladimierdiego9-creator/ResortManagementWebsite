{% extends "base.html" %}
{% block title %}Settings - {{ resort_name }}{% endblock %}
{% block content %}
<h1><i class="fas fa-cog"></i> System Settings</h1>
<div class="card mt-4">
    <div class="card-body">
        <form method="POST" action="{{ url_for('system_settings.update_general') }}">
            <h5>General Settings</h5>
            <div class="mb-3"><label>Resort Name</label><input type="text" class="form-control" name="resort_name" value="{{ resort.resort_name }}"></div>
            <div class="mb-3"><label>Email</label><input type="email" class="form-control" name="email" value="{{ resort.email }}"></div>
            <div class="mb-3"><label>Phone</label><input type="tel" class="form-control" name="phone" value="{{ resort.phone }}"></div>
            <button type="submit" class="btn btn-primary">Save Settings</button>
        </form>
    </div>
</div>
{% endblock %}
